<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Agentic Solution</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="header-info">
                <h1>HR Assistant</h1>
                <span class="status-indicator"></span>
            </div>
            <p class="subtitle">Ask about policies, submit leave, or manage IT tickets.</p>
        </header>

        <div class="chat-history" id="chatHistory">
            <!-- Messages will be injected here -->
            <div class="message system-msg">
                <div class="avatar">🤖</div>
                <div class="bubble">Hello! I am your centralized HR Assistant. How can I help you today?</div>
            </div>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Type your request here..." autocomplete="off" required>
            <button type="submit" id="sendBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
